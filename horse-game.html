<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pferdesprung - Horse Jumping Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* position:fixed + overflow:hidden on both prevents iOS Safari rubber-band scroll
     that blocks touch events from reaching the canvas */
  html {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    overflow: hidden;
    /* iOS safe-area (notch / home indicator) */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    border: 3px solid #5a3a1a;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(200, 140, 60, 0.4);
    cursor: pointer;
    max-width: 100%;
    /* Prevent iOS Safari from stealing touches for scrolling/zooming */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #hint {
    color: #c8a050;
    font-size: 13px;
    margin-top: 8px;
    opacity: 0.8;
    letter-spacing: 1px;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">TIPPEN / LEERTASTE zum Springen</div>
<script>
  // Show keyboard hint only on non-touch devices
  if (!('ontouchstart' in window)) {
    document.getElementById('hint').textContent = 'LEERTASTE / KLICK zum Springen  |  R zum Neustart';
  }
</script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Responsive canvas with HiDPI (retina) support
const BASE_W = 900, BASE_H = 400;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  // Use clientWidth/clientHeight – more reliable on iOS than innerWidth/innerHeight
  const availW = document.documentElement.clientWidth  || window.innerWidth;
  const availH = document.documentElement.clientHeight || window.innerHeight;
  const scale = Math.min(availW / BASE_W, (availH - 28) / BASE_H);
  const cssW = Math.max(1, Math.floor(BASE_W * scale));
  const cssH = Math.max(1, Math.floor(BASE_H * scale));
  // Physical pixels = CSS pixels × devicePixelRatio → sharp on Retina
  canvas.width  = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
}
resize();
// Use visualViewport when available (handles iOS Safari toolbar show/hide)
const vpListener = () => resize();
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', vpListener);
} else {
  window.addEventListener('resize', vpListener);
}

// Scale helper
function s(v) { return v * (canvas.width / BASE_W); }

// ── Game State ────────────────────────────────────────────────────────────────
const STATE = { TITLE: 0, PLAY: 1, DEAD: 2 };
let state = STATE.TITLE;
let score = 0;
let highScore = parseInt(localStorage.getItem('horseHS') || '0');
let gameSpeed = 1;
let frameCount = 0;
let lastTime = 0;
let animFrame;

// ── Ground & Physics ──────────────────────────────────────────────────────────
const GROUND_Y = BASE_H - 70; // horse feet rest here
const GRAVITY = 0.55;
const JUMP_POWER = -13;

// ── Horse ─────────────────────────────────────────────────────────────────────
const horse = {
  x: 130,
  y: GROUND_Y,
  vy: 0,
  onGround: true,
  runFrame: 0,
  runTimer: 0,
  FRAMES: 4,
  dead: false,
  // hitbox (relative to draw origin which is feet-center)
  hbx: -28, hby: -80, hbw: 56, hbh: 80,

  jump() {
    if (this.onGround) {
      this.vy = JUMP_POWER;
      this.onGround = false;
    }
  },

  update(dt) {
    // animate run
    this.runTimer += dt * gameSpeed;
    if (this.runTimer > 120) { this.runTimer = 0; this.runFrame = (this.runFrame + 1) % this.FRAMES; }

    // gravity
    if (!this.onGround) {
      this.vy += GRAVITY;
      this.y += this.vy;
      if (this.y >= GROUND_Y) {
        this.y = GROUND_Y;
        this.vy = 0;
        this.onGround = true;
      }
    }
  },

  draw(ctx) {
    const x = s(this.x), y = s(this.y);
    const sc = s(1);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    drawHorse(ctx, this.runFrame, !this.onGround);
    ctx.restore();
  },

  hitbox() {
    return {
      x: s(this.x + this.hbx + 8),
      y: s(this.y + this.hby + 10),
      w: s(this.hbw - 16),
      h: s(this.hbh - 10)
    };
  }
};

// ── Draw Horse (Haflinger – inspired by the painting) ─────────────────────────
function drawHorse(ctx, frame, jumping) {
  // frame: 0-3 running cycle; jumping overrides legs

  // ── Leg positions per frame ────────────────────────────────────────────────
  const legSets = [
    { fl: [5, -20, 8, 0],   fr: [-5, -18, -6, 2],  rl: [3, -18, 10, 0],  rr: [-3, -20, -8, 2] },
    { fl: [8, -15, 12, 4],  fr: [-8, -22, -10, -2], rl: [6, -15, 14, 4], rr: [-6, -22, -12, -2] },
    { fl: [5, -22, 6, 0],   fr: [-3, -18, -4, 2],  rl: [3, -20, 8, 0],  rr: [-3, -18, -6, 2] },
    { fl: [2, -18, 4, 4],   fr: [-10, -16, -14, 4], rl: [0, -18, 2, 4], rr: [-10, -16, -14, 4] },
  ];
  const legs = jumping
    ? { fl: [-6, -30, -12, -22], fr: [6, -30, 12, -22], rl: [-8, -28, -14, -18], rr: [8, -28, 14, -18] }
    : legSets[frame];

  // Haflinger colours (from the painting)
  const GOLD       = '#D4762C';   // warm golden-orange coat
  const GOLD_DARK  = '#A34E18';   // shadow / underside
  const GOLD_LIGHT = '#E8954A';   // highlight / flank sheen
  const MANE       = '#F2EAD0';   // pale cream-blonde mane & tail
  const MANE2      = '#E8DFC0';   // second mane strand
  const HOOF       = '#1a1a1a';   // very dark hooves
  const HALTER     = '#1a1a2e';   // dark navy halter
  const EYE_COL    = '#0d0d0d';
  const NOSTRIL    = '#7a2e0e';

  function leg(ox, oy, kx, ky, hx, hy) {
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.quadraticCurveTo(kx, ky, hx, hy);
    ctx.lineWidth = 6;
    ctx.strokeStyle = GOLD_DARK;
    ctx.stroke();
    // lower leg slightly lighter
    ctx.beginPath();
    ctx.moveTo((ox + kx) / 2, (oy + ky) / 2);
    ctx.quadraticCurveTo(kx, ky, hx, hy);
    ctx.lineWidth = 5;
    ctx.strokeStyle = GOLD;
    ctx.stroke();
    // hoof – wide, flat
    ctx.beginPath();
    ctx.ellipse(hx, hy + 1, 5, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = HOOF;
    ctx.fill();
  }

  // Back legs
  leg(0, -22, legs.rl[0], legs.rl[1] - 44, legs.rl[2], legs.rl[3] - 44);
  leg(4, -22, legs.rr[0] + 2, legs.rr[1] - 44, legs.rr[2] + 2, legs.rr[3] - 44);

  // Body – stocky Haflinger barrel (wider than before)
  ctx.beginPath();
  ctx.ellipse(0, -44, 36, 22, -0.05, 0, Math.PI * 2);
  ctx.fillStyle = GOLD;
  ctx.fill();

  // Belly shading (darker underneath)
  const bellyGrad = ctx.createLinearGradient(0, -62, 0, -24);
  bellyGrad.addColorStop(0, 'rgba(0,0,0,0)');
  bellyGrad.addColorStop(1, 'rgba(80,30,0,0.35)');
  ctx.beginPath();
  ctx.ellipse(0, -44, 36, 22, -0.05, 0, Math.PI * 2);
  ctx.fillStyle = bellyGrad;
  ctx.fill();

  // Flank highlight (the gloss you see in the painting)
  ctx.beginPath();
  ctx.ellipse(6, -52, 16, 9, -0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(240,160,80,0.28)';
  ctx.fill();

  // Haunch muscle definition
  ctx.beginPath();
  ctx.ellipse(-14, -38, 10, 8, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(80,30,0,0.18)';
  ctx.fill();

  // Neck – arched, thicker (Haflinger has a strong crest)
  ctx.beginPath();
  ctx.moveTo(20, -56);
  ctx.bezierCurveTo(32, -60, 34, -72, 26, -82);
  ctx.bezierCurveTo(20, -90, 10, -92, 8, -85);
  ctx.bezierCurveTo(5, -77, 12, -68, 14, -62);
  ctx.closePath();
  ctx.fillStyle = GOLD;
  ctx.fill();
  // neck shadow
  ctx.beginPath();
  ctx.moveTo(14, -62);
  ctx.bezierCurveTo(10, -68, 8, -76, 10, -84);
  ctx.bezierCurveTo(6, -80, 5, -72, 8, -64);
  ctx.closePath();
  ctx.fillStyle = 'rgba(80,30,0,0.22)';
  ctx.fill();

  // Head – slightly broader snout (Haflinger dish face)
  ctx.beginPath();
  ctx.ellipse(24, -90, 13, 11, 0.5, 0, Math.PI * 2);
  ctx.fillStyle = GOLD;
  ctx.fill();

  // Snout – paler, wider
  ctx.beginPath();
  ctx.ellipse(34, -87, 9, 7, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#dda060';
  ctx.fill();
  // muzzle highlight
  ctx.beginPath();
  ctx.ellipse(35, -89, 4, 3, 0.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,220,160,0.35)';
  ctx.fill();

  // Nostril
  ctx.beginPath();
  ctx.ellipse(39, -86, 2.2, 1.6, 0.4, 0, Math.PI * 2);
  ctx.fillStyle = NOSTRIL;
  ctx.fill();

  // Eye – warm dark brown
  ctx.beginPath();
  ctx.ellipse(18, -94, 2.8, 2.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = EYE_COL;
  ctx.fill();
  // eye shine
  ctx.beginPath();
  ctx.arc(19.5, -95.2, 0.8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();

  // Ear – slightly longer, alert
  ctx.beginPath();
  ctx.moveTo(14, -99);
  ctx.lineTo(10, -108);
  ctx.lineTo(18, -103);
  ctx.closePath();
  ctx.fillStyle = GOLD;
  ctx.fill();
  // inner ear
  ctx.beginPath();
  ctx.moveTo(13.5, -100);
  ctx.lineTo(11, -106);
  ctx.lineTo(16, -103);
  ctx.closePath();
  ctx.fillStyle = '#e8a06a';
  ctx.fill();

  // ── Tail (drawn before front legs so legs overlap) ────────────────────────
  const sway = jumping ? 0 : Math.sin(frame * 1.6) * 4;
  // thick tail base
  ctx.beginPath();
  ctx.moveTo(-30, -52);
  if (jumping) {
    ctx.bezierCurveTo(-42, -42, -48, -28, -42, -14);
  } else {
    ctx.bezierCurveTo(-42 + sway, -40, -48 + sway, -22, -40 + sway, -6);
  }
  ctx.lineWidth = 10;
  ctx.strokeStyle = MANE;
  ctx.lineCap = 'round';
  ctx.stroke();
  // second tail strand
  ctx.beginPath();
  ctx.moveTo(-28, -50);
  if (jumping) {
    ctx.bezierCurveTo(-38, -36, -44, -18, -36, -2);
  } else {
    ctx.bezierCurveTo(-38 + sway * 0.8, -34, -42 + sway, -16, -34 + sway * 1.2, 4);
  }
  ctx.lineWidth = 6;
  ctx.strokeStyle = MANE2;
  ctx.stroke();

  // Front legs
  leg(-4, -26, legs.fl[0] - 4, legs.fl[1] - 28, legs.fl[2] - 4, legs.fl[3] - 28);
  leg(4, -26, legs.fr[0] + 4, legs.fr[1] - 28, legs.fr[2] + 4, legs.fr[3] - 28);

  // ── Mane – thick, flowing cream-blonde ────────────────────────────────────
  // main strand
  ctx.beginPath();
  ctx.moveTo(16, -86);
  ctx.bezierCurveTo(8, -84, 4, -76, 6, -68);
  ctx.bezierCurveTo(2, -72, -2, -64, 0, -56);
  ctx.lineWidth = 9;
  ctx.strokeStyle = MANE;
  ctx.lineCap = 'round';
  ctx.stroke();
  // second strand
  ctx.beginPath();
  ctx.moveTo(14, -88);
  ctx.bezierCurveTo(6, -86, 1, -77, 3, -69);
  ctx.bezierCurveTo(-1, -74, -4, -65, -2, -57);
  ctx.lineWidth = 6;
  ctx.strokeStyle = MANE2;
  ctx.stroke();
  // forelock (fringe between ears)
  ctx.beginPath();
  ctx.moveTo(16, -98);
  ctx.bezierCurveTo(20, -104, 22, -100, 18, -94);
  ctx.lineWidth = 4;
  ctx.strokeStyle = MANE;
  ctx.stroke();

  // ── Halter – dark navy, two straps ────────────────────────────────────────
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = HALTER;
  ctx.lineCap = 'round';
  // nose band
  ctx.beginPath();
  ctx.arc(24, -89, 9, -0.2, 0.7);
  ctx.stroke();
  // cheek strap
  ctx.beginPath();
  ctx.moveTo(18, -97);
  ctx.lineTo(16, -88);
  ctx.stroke();
  // lead ring hint
  ctx.beginPath();
  ctx.arc(30, -84, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = '#555';
  ctx.fill();
}

// ── Obstacles (Fences) ────────────────────────────────────────────────────────
let fences = [];
let nextFenceX = BASE_W + 200;

function spawnFence() {
  const tall = Math.random() < 0.35;
  fences.push({
    x: BASE_W + 50,
    w: 60,
    h: tall ? 72 : 52,
    posts: Math.random() < 0.5 ? 3 : 2
  });
  const minGap = Math.max(280 - score * 0.4, 160);
  const maxGap = Math.max(380 - score * 0.2, 220);
  nextFenceX = BASE_W + 50 + minGap + Math.random() * (maxGap - minGap);
}

function drawFence(ctx, f) {
  const x = s(f.x), y = s(GROUND_Y), h = s(f.h), w = s(f.w);
  const WOOD = '#4a2e0f';
  const WOOD_LIGHT = '#6a4020';
  const postW = s(8);
  const nPosts = f.posts;

  // Posts
  for (let i = 0; i < nPosts; i++) {
    const px = x + (i / (nPosts - 1)) * (w - postW);
    ctx.fillStyle = WOOD;
    ctx.fillRect(px, y - h - s(6), postW, h + s(6));
    // highlight
    ctx.fillStyle = WOOD_LIGHT;
    ctx.fillRect(px + s(1), y - h - s(6), s(2), h + s(6));
    // post cap
    ctx.fillStyle = WOOD_LIGHT;
    ctx.fillRect(px - s(1), y - h - s(8), postW + s(2), s(4));
  }

  // Rails (2)
  const rail1y = y - h * 0.75;
  const rail2y = y - h * 0.3;
  [rail1y, rail2y].forEach(ry => {
    ctx.fillStyle = WOOD;
    ctx.fillRect(x, ry - s(5), w, s(9));
    ctx.fillStyle = WOOD_LIGHT;
    ctx.fillRect(x, ry - s(5), w, s(2));
  });

  // Wood grain lines
  ctx.strokeStyle = WOOD;
  ctx.lineWidth = 1;
  for (let gx = x + s(6); gx < x + w - s(6); gx += s(10)) {
    ctx.beginPath();
    ctx.moveTo(gx, rail1y - s(5));
    ctx.lineTo(gx + s(2), rail1y + s(4));
    ctx.stroke();
  }
}

function fenceHitbox(f) {
  // narrow hitbox for fairness
  return {
    x: s(f.x + 6),
    y: s(GROUND_Y - f.h - 4),
    w: s(f.w - 12),
    h: s(f.h + 4)
  };
}

// ── Parallax Background ───────────────────────────────────────────────────────
let bgOffset = 0;

// Hill generators for distant landscape
const hills = Array.from({ length: 8 }, (_, i) => ({
  x: i * 130,
  w: 110 + Math.random() * 80,
  h: 60 + Math.random() * 50,
  color: `hsl(${140 + Math.random() * 20}, ${20 + Math.random() * 15}%, ${30 + Math.random() * 10}%)`
}));

// Tree clusters
const trees = Array.from({ length: 14 }, (_, i) => ({
  x: i * 68 + Math.random() * 30,
  h: 30 + Math.random() * 25,
  w: 18 + Math.random() * 14,
  color: `hsl(${130 + Math.random() * 20}, ${35 + Math.random() * 20}%, ${22 + Math.random() * 12}%)`
}));

// Meadow strips
const meadows = [
  { y: 0.42, h: 0.06, color: '#7a9e50' },
  { y: 0.48, h: 0.08, color: '#8ab050' },
  { y: 0.55, h: 0.08, color: '#9cc055' },
];

function drawBackground(ctx) {
  const W = canvas.width, H = canvas.height;

  // Sky gradient (matches painting: turquoise top → stormy grey)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.52);
  skyGrad.addColorStop(0, '#4db8c8');
  skyGrad.addColorStop(0.3, '#7ecbd8');
  skyGrad.addColorStop(0.6, '#8ab0a8');
  skyGrad.addColorStop(1, '#788a78');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.52);

  // Clouds
  drawClouds(ctx, W, H);

  // Distant dark hills (parallax 0.08x)
  const hillOff = (bgOffset * 0.08) % (W * 1.2);
  ctx.fillStyle = '#4a5a48';
  for (let rep = -1; rep <= 1; rep++) {
    hills.forEach(h => {
      const hx = (h.x * (W / BASE_W) - hillOff + rep * W * 1.4) % (W * 1.4);
      ctx.beginPath();
      ctx.ellipse(hx, H * 0.44, h.w * (W / BASE_W), h.h * (H / BASE_H), 0, Math.PI, 0);
      ctx.fill();
    });
  }

  // Mid meadow strips
  meadows.forEach(m => {
    ctx.fillStyle = m.color;
    ctx.fillRect(0, H * m.y, W, H * m.h);
  });

  // Tree clusters (parallax 0.35x)
  const treeOff = (bgOffset * 0.35) % (W * 1.5);
  for (let rep = -1; rep <= 1; rep++) {
    trees.forEach(t => {
      const tx = (t.x * (W / BASE_W) - treeOff + rep * W * 1.5) % (W * 1.5);
      const ty = H * 0.52;
      const tw = t.w * (W / BASE_W);
      const th = t.h * (H / BASE_H);
      ctx.fillStyle = t.color;
      // trunk
      ctx.fillRect(tx - tw * 0.1, ty, tw * 0.2, th * 0.4);
      // canopy
      ctx.beginPath();
      ctx.ellipse(tx, ty - th * 0.1, tw * 0.55, th * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // Foreground green field
  const fieldGrad = ctx.createLinearGradient(0, H * 0.62, 0, H);
  fieldGrad.addColorStop(0, '#6eb040');
  fieldGrad.addColorStop(0.3, '#5a9c30');
  fieldGrad.addColorStop(1, '#4a8828');
  ctx.fillStyle = fieldGrad;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  // Grass texture strip
  ctx.fillStyle = '#78b840';
  ctx.fillRect(0, H * 0.62, W, H * 0.03);
}

let cloudOffset = 0;
const clouds = Array.from({ length: 6 }, (_, i) => ({
  x: i * 160 + Math.random() * 60,
  y: 0.04 + Math.random() * 0.14,
  r: 18 + Math.random() * 22,
  opacity: 0.55 + Math.random() * 0.35
}));

function drawClouds(ctx, W, H) {
  cloudOffset += 0.15 * gameSpeed;
  clouds.forEach(c => {
    const cx = (c.x * (W / BASE_W) - cloudOffset * 0.5) % (W + 100);
    const cy = H * c.y;
    const r = c.r * (W / BASE_W);
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = '#c8d8d0';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.8, cy - r * 0.2, r * 0.7, 0, Math.PI * 2);
    ctx.arc(cx - r * 0.7, cy + r * 0.1, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── Grass tufts foreground ────────────────────────────────────────────────────
let grassOffset = 0;
const grassTufts = Array.from({ length: 20 }, (_, i) => ({
  x: i * 50,
  h: 4 + Math.random() * 7,
}));

function drawGrass(ctx) {
  const W = canvas.width, H = canvas.height;
  grassOffset += gameSpeed * 3;
  const colors = ['#4a8828', '#5aa030', '#68b038'];
  grassTufts.forEach((g, i) => {
    const gx = ((g.x * (W / BASE_W)) - grassOffset % (W + 60) + W + 60) % (W + 60) - 10;
    const gy = H * 0.83;
    ctx.strokeStyle = colors[i % 3];
    ctx.lineWidth = 1.5;
    for (let j = -2; j <= 2; j++) {
      ctx.beginPath();
      ctx.moveTo(gx + j * 3, gy + 2);
      ctx.quadraticCurveTo(gx + j * 3 + 2, gy - g.h * (H / BASE_H), gx + j * 3 + 4, gy - g.h * (H / BASE_H) * 0.4);
      ctx.stroke();
    }
  });
}

// ── Ground line ───────────────────────────────────────────────────────────────
function drawGround(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#3a7018';
  ctx.fillRect(0, H * 0.83, W, H * 0.005);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W - s(160), s(10), s(150), s(52));
  ctx.fillStyle = '#f0d080';
  ctx.font = `bold ${s(14)}px Georgia`;
  ctx.textAlign = 'right';
  ctx.fillText(`Punkte: ${Math.floor(score)}`, W - s(16), s(30));
  ctx.fillStyle = '#c0a060';
  ctx.font = `${s(11)}px Georgia`;
  ctx.fillText(`Rekord: ${Math.floor(highScore)}`, W - s(16), s(52));
  ctx.textAlign = 'left';
}

// ── Overlay screens ───────────────────────────────────────────────────────────
function drawTitle(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#f0d890';
  ctx.font = `bold ${s(36)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('🐴 Pferdesprung', W / 2, H * 0.38);

  ctx.fillStyle = '#d0c080';
  ctx.font = `${s(16)}px Georgia`;
  ctx.fillText('Springe über die Zäune!', W / 2, H * 0.52);

  ctx.fillStyle = '#f0f0f0';
  ctx.font = `${s(13)}px Georgia`;
  ctx.fillText('LEERTASTE, KLICK oder TIPPEN zum Starten', W / 2, H * 0.66);
  ctx.textAlign = 'left';
}

function drawDead(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ff8060';
  ctx.font = `bold ${s(32)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('Oje! Gestürzt!', W / 2, H * 0.36);

  ctx.fillStyle = '#f0d080';
  ctx.font = `${s(18)}px Georgia`;
  ctx.fillText(`Punkte: ${Math.floor(score)}`, W / 2, H * 0.50);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#ffe040';
    ctx.font = `bold ${s(14)}px Georgia`;
    ctx.fillText('🏆 Neuer Rekord!', W / 2, H * 0.60);
  } else {
    ctx.fillStyle = '#c0a060';
    ctx.font = `${s(14)}px Georgia`;
    ctx.fillText(`Rekord: ${Math.floor(highScore)}`, W / 2, H * 0.60);
  }

  ctx.fillStyle = '#f0f0f0';
  ctx.font = `${s(13)}px Georgia`;
  ctx.fillText('R oder KLICK zum Neustart', W / 2, H * 0.73);
  ctx.textAlign = 'left';
}

// ── Collision ─────────────────────────────────────────────────────────────────
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function resetGame() {
  horse.y = GROUND_Y;
  horse.vy = 0;
  horse.onGround = true;
  horse.runFrame = 0;
  horse.dead = false;
  fences = [];
  nextFenceX = BASE_W + 200;
  score = 0;
  gameSpeed = 1;
  bgOffset = 0;
  grassOffset = 0;
  frameCount = 0;
  state = STATE.PLAY;
}

// ── Input ─────────────────────────────────────────────────────────────────────
function handleJump() {
  if (state === STATE.TITLE) { resetGame(); return; }
  if (state === STATE.DEAD) { resetGame(); return; }
  if (state === STATE.PLAY) horse.jump();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleJump(); }
  if ((e.code === 'KeyR') && state === STATE.DEAD) resetGame();
});
canvas.addEventListener('click', handleJump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleJump(); }, { passive: false });

// ── Main Loop ─────────────────────────────────────────────────────────────────
function gameLoop(ts) {
  // Guard: on first frame lastTime=0; initialise from rAF timestamp
  // so we never compute a huge dt on iOS where performance.now() and
  // the rAF timestamp may have different sub-ms origins.
  if (lastTime === 0) { lastTime = ts; }
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // Update
  if (state === STATE.PLAY) {
    frameCount++;
    score += 0.04 * gameSpeed;
    gameSpeed = 1 + score * 0.006;
    bgOffset += gameSpeed * 3;

    horse.update(dt);

    // Spawn fences
    if (fences.length === 0 || fences[fences.length - 1].x < nextFenceX - BASE_W) {
      spawnFence();
    }

    // Move & remove fences
    fences.forEach(f => { f.x -= gameSpeed * 3.5; });
    fences = fences.filter(f => f.x > -100);

    // Collision
    const hb = horse.hitbox();
    for (const f of fences) {
      if (rectsOverlap(hb, fenceHitbox(f))) {
        state = STATE.DEAD;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('horseHS', Math.floor(highScore));
        }
        break;
      }
    }
  }

  // Draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground(ctx);
  drawGrass(ctx);
  drawGround(ctx);

  fences.forEach(f => drawFence(ctx, f));

  if (state !== STATE.TITLE) {
    horse.draw(ctx);
    drawHUD(ctx);
  }

  if (state === STATE.TITLE) drawTitle(ctx);
  if (state === STATE.DEAD) { horse.draw(ctx); drawDead(ctx); }

  // Debug hitboxes (uncomment to enable)
  // if (state === STATE.PLAY) {
  //   const hb = horse.hitbox();
  //   ctx.strokeStyle = 'red'; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
  //   fences.forEach(f => { const fb = fenceHitbox(f); ctx.strokeStyle='blue'; ctx.strokeRect(fb.x,fb.y,fb.w,fb.h); });
  // }

  animFrame = requestAnimationFrame(gameLoop);
}

// Kick off (lastTime=0 is handled inside gameLoop on first frame)
animFrame = requestAnimationFrame(gameLoop);
</script>
