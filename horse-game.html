<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pferdesprung - Horse Jumping Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Georgia, serif;
    overflow: hidden;
  }
  canvas {
    border: 3px solid #5a3a1a;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(200, 140, 60, 0.4);
    cursor: pointer;
    max-width: 100vw;
  }
  #hint {
    color: #c8a050;
    font-size: 13px;
    margin-top: 10px;
    opacity: 0.8;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">LEERTASTE / KLICK zum Springen &nbsp;|&nbsp; R zum Neustart</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Responsive canvas
const BASE_W = 900, BASE_H = 400;
function resize() {
  const scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / (BASE_H + 60));
  canvas.width = Math.floor(BASE_W * scale);
  canvas.height = Math.floor(BASE_H * scale);
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
}
resize();
window.addEventListener('resize', () => { resize(); });

// Scale helper
function s(v) { return v * (canvas.width / BASE_W); }

// ── Game State ────────────────────────────────────────────────────────────────
const STATE = { TITLE: 0, PLAY: 1, DEAD: 2 };
let state = STATE.TITLE;
let score = 0;
let highScore = parseInt(localStorage.getItem('horseHS') || '0');
let gameSpeed = 1;
let frameCount = 0;
let lastTime = 0;
let animFrame;

// ── Ground & Physics ──────────────────────────────────────────────────────────
const GROUND_Y = BASE_H - 70; // horse feet rest here
const GRAVITY = 0.55;
const JUMP_POWER = -13;

// ── Horse ─────────────────────────────────────────────────────────────────────
const horse = {
  x: 130,
  y: GROUND_Y,
  vy: 0,
  onGround: true,
  runFrame: 0,
  runTimer: 0,
  FRAMES: 4,
  dead: false,
  // hitbox (relative to draw origin which is feet-center)
  hbx: -28, hby: -80, hbw: 56, hbh: 80,

  jump() {
    if (this.onGround) {
      this.vy = JUMP_POWER;
      this.onGround = false;
    }
  },

  update(dt) {
    // animate run
    this.runTimer += dt * gameSpeed;
    if (this.runTimer > 120) { this.runTimer = 0; this.runFrame = (this.runFrame + 1) % this.FRAMES; }

    // gravity
    if (!this.onGround) {
      this.vy += GRAVITY;
      this.y += this.vy;
      if (this.y >= GROUND_Y) {
        this.y = GROUND_Y;
        this.vy = 0;
        this.onGround = true;
      }
    }
  },

  draw(ctx) {
    const x = s(this.x), y = s(this.y);
    const sc = s(1);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    drawHorse(ctx, this.runFrame, !this.onGround);
    ctx.restore();
  },

  hitbox() {
    return {
      x: s(this.x + this.hbx + 8),
      y: s(this.y + this.hby + 10),
      w: s(this.hbw - 16),
      h: s(this.hbh - 10)
    };
  }
};

// ── Draw Horse (Canvas art inspired by the painting) ──────────────────────────
function drawHorse(ctx, frame, jumping) {
  // frame: 0-3 running cycle; jumping overrides legs

  // ── Leg positions per frame ────────────────────────────────────────────────
  const legSets = [
    // FL-back, FR-back, RL-back, RR-back (knee angle)
    { fl: [5, -20, 8, 0],   fr: [-5, -18, -6, 2],  rl: [3, -18, 10, 0],  rr: [-3, -20, -8, 2] },
    { fl: [8, -15, 12, 4],  fr: [-8, -22, -10, -2], rl: [6, -15, 14, 4], rr: [-6, -22, -12, -2] },
    { fl: [5, -22, 6, 0],   fr: [-3, -18, -4, 2],  rl: [3, -20, 8, 0],  rr: [-3, -18, -6, 2] },
    { fl: [2, -18, 4, 4],   fr: [-10, -16, -14, 4], rl: [0, -18, 2, 4], rr: [-10, -16, -14, 4] },
  ];
  const legs = jumping
    ? { fl: [-6, -30, -12, -22], fr: [6, -30, 12, -22], rl: [-8, -28, -14, -18], rr: [8, -28, 14, -18] }
    : legSets[frame];

  // Colors
  const CHESTNUT = '#C0692A';
  const CHESTNUT_DARK = '#8B3E0F';
  const MANE = '#F0E0B0';
  const HOOF = '#2a2a2a';
  const HALTER = '#222244';
  const EYE_COL = '#111';
  const NOSTRIL = '#7a3010';

  function leg(ox, oy, kx, ky, hx, hy) {
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.quadraticCurveTo(kx, ky, hx, hy);
    ctx.lineWidth = 5;
    ctx.strokeStyle = CHESTNUT_DARK;
    ctx.stroke();
    // hoof
    ctx.beginPath();
    ctx.ellipse(hx, hy + 1, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = HOOF;
    ctx.fill();
  }

  // Back legs
  leg(0, -22, legs.rl[0], legs.rl[1] - 44, legs.rl[2], legs.rl[3] - 44);
  leg(4, -22, legs.rr[0] + 2, legs.rr[1] - 44, legs.rr[2] + 2, legs.rr[3] - 44);

  // Body
  ctx.beginPath();
  ctx.ellipse(0, -44, 32, 20, -0.05, 0, Math.PI * 2);
  ctx.fillStyle = CHESTNUT;
  ctx.fill();

  // Neck
  ctx.beginPath();
  ctx.moveTo(18, -58);
  ctx.bezierCurveTo(28, -62, 30, -72, 24, -80);
  ctx.bezierCurveTo(18, -88, 10, -90, 8, -84);
  ctx.bezierCurveTo(6, -78, 12, -68, 14, -62);
  ctx.closePath();
  ctx.fillStyle = CHESTNUT;
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.ellipse(22, -90, 13, 10, 0.5, 0, Math.PI * 2);
  ctx.fillStyle = CHESTNUT;
  ctx.fill();

  // Snout
  ctx.beginPath();
  ctx.ellipse(32, -86, 8, 6, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#d0803a';
  ctx.fill();

  // Nostril
  ctx.beginPath();
  ctx.ellipse(37, -85, 2, 1.5, 0.4, 0, Math.PI * 2);
  ctx.fillStyle = NOSTRIL;
  ctx.fill();

  // Eye
  ctx.beginPath();
  ctx.ellipse(18, -94, 2.5, 2, 0, 0, Math.PI * 2);
  ctx.fillStyle = EYE_COL;
  ctx.fill();
  // eye shine
  ctx.beginPath();
  ctx.arc(19, -95, 0.7, 0, Math.PI * 2);
  ctx.fillStyle = 'white';
  ctx.fill();

  // Ear
  ctx.beginPath();
  ctx.moveTo(14, -98);
  ctx.lineTo(10, -106);
  ctx.lineTo(17, -102);
  ctx.closePath();
  ctx.fillStyle = CHESTNUT;
  ctx.fill();

  // Mane
  ctx.beginPath();
  ctx.moveTo(14, -84);
  ctx.bezierCurveTo(8, -82, 4, -74, 6, -66);
  ctx.bezierCurveTo(2, -70, -2, -62, 0, -54);
  ctx.lineWidth = 7;
  ctx.strokeStyle = MANE;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Tail
  ctx.beginPath();
  ctx.moveTo(-28, -48);
  if (jumping) {
    ctx.bezierCurveTo(-38, -38, -44, -28, -38, -16);
    ctx.bezierCurveTo(-42, -24, -46, -14, -40, -4);
  } else {
    const sway = Math.sin(frame * 1.6) * 4;
    ctx.bezierCurveTo(-38 + sway, -38, -44 + sway, -20, -36 + sway, -4);
    ctx.bezierCurveTo(-40 + sway, -12, -44 + sway, -2, -36 + sway, 6);
  }
  ctx.lineWidth = 8;
  ctx.strokeStyle = MANE;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Front legs
  leg(-4, -26, legs.fl[0] - 4, legs.fl[1] - 28, legs.fl[2] - 4, legs.fl[3] - 28);
  leg(4, -26, legs.fr[0] + 4, legs.fr[1] - 28, legs.fr[2] + 4, legs.fr[3] - 28);

  // Halter
  ctx.beginPath();
  ctx.arc(22, -90, 8, -0.3, 0.6);
  ctx.lineWidth = 2;
  ctx.strokeStyle = HALTER;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(28, -86);
  ctx.lineTo(30, -80);
  ctx.stroke();
}

// ── Obstacles (Fences) ────────────────────────────────────────────────────────
let fences = [];
let nextFenceX = BASE_W + 200;

function spawnFence() {
  const tall = Math.random() < 0.35;
  fences.push({
    x: BASE_W + 50,
    w: 60,
    h: tall ? 72 : 52,
    posts: Math.random() < 0.5 ? 3 : 2
  });
  const minGap = Math.max(280 - score * 0.4, 160);
  const maxGap = Math.max(380 - score * 0.2, 220);
  nextFenceX = BASE_W + 50 + minGap + Math.random() * (maxGap - minGap);
}

function drawFence(ctx, f) {
  const x = s(f.x), y = s(GROUND_Y), h = s(f.h), w = s(f.w);
  const WOOD = '#4a2e0f';
  const WOOD_LIGHT = '#6a4020';
  const postW = s(8);
  const nPosts = f.posts;

  // Posts
  for (let i = 0; i < nPosts; i++) {
    const px = x + (i / (nPosts - 1)) * (w - postW);
    ctx.fillStyle = WOOD;
    ctx.fillRect(px, y - h - s(6), postW, h + s(6));
    // highlight
    ctx.fillStyle = WOOD_LIGHT;
    ctx.fillRect(px + s(1), y - h - s(6), s(2), h + s(6));
    // post cap
    ctx.fillStyle = WOOD_LIGHT;
    ctx.fillRect(px - s(1), y - h - s(8), postW + s(2), s(4));
  }

  // Rails (2)
  const rail1y = y - h * 0.75;
  const rail2y = y - h * 0.3;
  [rail1y, rail2y].forEach(ry => {
    ctx.fillStyle = WOOD;
    ctx.fillRect(x, ry - s(5), w, s(9));
    ctx.fillStyle = WOOD_LIGHT;
    ctx.fillRect(x, ry - s(5), w, s(2));
  });

  // Wood grain lines
  ctx.strokeStyle = WOOD;
  ctx.lineWidth = 1;
  for (let gx = x + s(6); gx < x + w - s(6); gx += s(10)) {
    ctx.beginPath();
    ctx.moveTo(gx, rail1y - s(5));
    ctx.lineTo(gx + s(2), rail1y + s(4));
    ctx.stroke();
  }
}

function fenceHitbox(f) {
  // narrow hitbox for fairness
  return {
    x: s(f.x + 6),
    y: s(GROUND_Y - f.h - 4),
    w: s(f.w - 12),
    h: s(f.h + 4)
  };
}

// ── Parallax Background ───────────────────────────────────────────────────────
let bgOffset = 0;

// Hill generators for distant landscape
const hills = Array.from({ length: 8 }, (_, i) => ({
  x: i * 130,
  w: 110 + Math.random() * 80,
  h: 60 + Math.random() * 50,
  color: `hsl(${140 + Math.random() * 20}, ${20 + Math.random() * 15}%, ${30 + Math.random() * 10}%)`
}));

// Tree clusters
const trees = Array.from({ length: 14 }, (_, i) => ({
  x: i * 68 + Math.random() * 30,
  h: 30 + Math.random() * 25,
  w: 18 + Math.random() * 14,
  color: `hsl(${130 + Math.random() * 20}, ${35 + Math.random() * 20}%, ${22 + Math.random() * 12}%)`
}));

// Meadow strips
const meadows = [
  { y: 0.42, h: 0.06, color: '#7a9e50' },
  { y: 0.48, h: 0.08, color: '#8ab050' },
  { y: 0.55, h: 0.08, color: '#9cc055' },
];

function drawBackground(ctx) {
  const W = canvas.width, H = canvas.height;

  // Sky gradient (matches painting: turquoise top → stormy grey)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.52);
  skyGrad.addColorStop(0, '#4db8c8');
  skyGrad.addColorStop(0.3, '#7ecbd8');
  skyGrad.addColorStop(0.6, '#8ab0a8');
  skyGrad.addColorStop(1, '#788a78');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.52);

  // Clouds
  drawClouds(ctx, W, H);

  // Distant dark hills (parallax 0.08x)
  const hillOff = (bgOffset * 0.08) % (W * 1.2);
  ctx.fillStyle = '#4a5a48';
  for (let rep = -1; rep <= 1; rep++) {
    hills.forEach(h => {
      const hx = (h.x * (W / BASE_W) - hillOff + rep * W * 1.4) % (W * 1.4);
      ctx.beginPath();
      ctx.ellipse(hx, H * 0.44, h.w * (W / BASE_W), h.h * (H / BASE_H), 0, Math.PI, 0);
      ctx.fill();
    });
  }

  // Mid meadow strips
  meadows.forEach(m => {
    ctx.fillStyle = m.color;
    ctx.fillRect(0, H * m.y, W, H * m.h);
  });

  // Tree clusters (parallax 0.35x)
  const treeOff = (bgOffset * 0.35) % (W * 1.5);
  for (let rep = -1; rep <= 1; rep++) {
    trees.forEach(t => {
      const tx = (t.x * (W / BASE_W) - treeOff + rep * W * 1.5) % (W * 1.5);
      const ty = H * 0.52;
      const tw = t.w * (W / BASE_W);
      const th = t.h * (H / BASE_H);
      ctx.fillStyle = t.color;
      // trunk
      ctx.fillRect(tx - tw * 0.1, ty, tw * 0.2, th * 0.4);
      // canopy
      ctx.beginPath();
      ctx.ellipse(tx, ty - th * 0.1, tw * 0.55, th * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // Foreground green field
  const fieldGrad = ctx.createLinearGradient(0, H * 0.62, 0, H);
  fieldGrad.addColorStop(0, '#6eb040');
  fieldGrad.addColorStop(0.3, '#5a9c30');
  fieldGrad.addColorStop(1, '#4a8828');
  ctx.fillStyle = fieldGrad;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  // Grass texture strip
  ctx.fillStyle = '#78b840';
  ctx.fillRect(0, H * 0.62, W, H * 0.03);
}

let cloudOffset = 0;
const clouds = Array.from({ length: 6 }, (_, i) => ({
  x: i * 160 + Math.random() * 60,
  y: 0.04 + Math.random() * 0.14,
  r: 18 + Math.random() * 22,
  opacity: 0.55 + Math.random() * 0.35
}));

function drawClouds(ctx, W, H) {
  cloudOffset += 0.15 * gameSpeed;
  clouds.forEach(c => {
    const cx = (c.x * (W / BASE_W) - cloudOffset * 0.5) % (W + 100);
    const cy = H * c.y;
    const r = c.r * (W / BASE_W);
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = '#c8d8d0';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.8, cy - r * 0.2, r * 0.7, 0, Math.PI * 2);
    ctx.arc(cx - r * 0.7, cy + r * 0.1, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── Grass tufts foreground ────────────────────────────────────────────────────
let grassOffset = 0;
const grassTufts = Array.from({ length: 20 }, (_, i) => ({
  x: i * 50,
  h: 4 + Math.random() * 7,
}));

function drawGrass(ctx) {
  const W = canvas.width, H = canvas.height;
  grassOffset += gameSpeed * 3;
  const colors = ['#4a8828', '#5aa030', '#68b038'];
  grassTufts.forEach((g, i) => {
    const gx = ((g.x * (W / BASE_W)) - grassOffset % (W + 60) + W + 60) % (W + 60) - 10;
    const gy = H * 0.83;
    ctx.strokeStyle = colors[i % 3];
    ctx.lineWidth = 1.5;
    for (let j = -2; j <= 2; j++) {
      ctx.beginPath();
      ctx.moveTo(gx + j * 3, gy + 2);
      ctx.quadraticCurveTo(gx + j * 3 + 2, gy - g.h * (H / BASE_H), gx + j * 3 + 4, gy - g.h * (H / BASE_H) * 0.4);
      ctx.stroke();
    }
  });
}

// ── Ground line ───────────────────────────────────────────────────────────────
function drawGround(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#3a7018';
  ctx.fillRect(0, H * 0.83, W, H * 0.005);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W - s(160), s(10), s(150), s(52));
  ctx.fillStyle = '#f0d080';
  ctx.font = `bold ${s(14)}px Georgia`;
  ctx.textAlign = 'right';
  ctx.fillText(`Punkte: ${Math.floor(score)}`, W - s(16), s(30));
  ctx.fillStyle = '#c0a060';
  ctx.font = `${s(11)}px Georgia`;
  ctx.fillText(`Rekord: ${Math.floor(highScore)}`, W - s(16), s(52));
  ctx.textAlign = 'left';
}

// ── Overlay screens ───────────────────────────────────────────────────────────
function drawTitle(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#f0d890';
  ctx.font = `bold ${s(36)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('🐴 Pferdesprung', W / 2, H * 0.38);

  ctx.fillStyle = '#d0c080';
  ctx.font = `${s(16)}px Georgia`;
  ctx.fillText('Springe über die Zäune!', W / 2, H * 0.52);

  ctx.fillStyle = '#f0f0f0';
  ctx.font = `${s(13)}px Georgia`;
  ctx.fillText('LEERTASTE, KLICK oder TIPPEN zum Starten', W / 2, H * 0.66);
  ctx.textAlign = 'left';
}

function drawDead(ctx) {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ff8060';
  ctx.font = `bold ${s(32)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('Oje! Gestürzt!', W / 2, H * 0.36);

  ctx.fillStyle = '#f0d080';
  ctx.font = `${s(18)}px Georgia`;
  ctx.fillText(`Punkte: ${Math.floor(score)}`, W / 2, H * 0.50);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#ffe040';
    ctx.font = `bold ${s(14)}px Georgia`;
    ctx.fillText('🏆 Neuer Rekord!', W / 2, H * 0.60);
  } else {
    ctx.fillStyle = '#c0a060';
    ctx.font = `${s(14)}px Georgia`;
    ctx.fillText(`Rekord: ${Math.floor(highScore)}`, W / 2, H * 0.60);
  }

  ctx.fillStyle = '#f0f0f0';
  ctx.font = `${s(13)}px Georgia`;
  ctx.fillText('R oder KLICK zum Neustart', W / 2, H * 0.73);
  ctx.textAlign = 'left';
}

// ── Collision ─────────────────────────────────────────────────────────────────
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function resetGame() {
  horse.y = GROUND_Y;
  horse.vy = 0;
  horse.onGround = true;
  horse.runFrame = 0;
  horse.dead = false;
  fences = [];
  nextFenceX = BASE_W + 200;
  score = 0;
  gameSpeed = 1;
  bgOffset = 0;
  grassOffset = 0;
  frameCount = 0;
  state = STATE.PLAY;
}

// ── Input ─────────────────────────────────────────────────────────────────────
function handleJump() {
  if (state === STATE.TITLE) { resetGame(); return; }
  if (state === STATE.DEAD) { resetGame(); return; }
  if (state === STATE.PLAY) horse.jump();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleJump(); }
  if ((e.code === 'KeyR') && state === STATE.DEAD) resetGame();
});
canvas.addEventListener('click', handleJump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleJump(); }, { passive: false });

// ── Main Loop ─────────────────────────────────────────────────────────────────
function gameLoop(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // Update
  if (state === STATE.PLAY) {
    frameCount++;
    score += 0.04 * gameSpeed;
    gameSpeed = 1 + score * 0.006;
    bgOffset += gameSpeed * 3;

    horse.update(dt);

    // Spawn fences
    if (fences.length === 0 || fences[fences.length - 1].x < nextFenceX - BASE_W) {
      spawnFence();
    }

    // Move & remove fences
    fences.forEach(f => { f.x -= gameSpeed * 3.5; });
    fences = fences.filter(f => f.x > -100);

    // Collision
    const hb = horse.hitbox();
    for (const f of fences) {
      if (rectsOverlap(hb, fenceHitbox(f))) {
        state = STATE.DEAD;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('horseHS', Math.floor(highScore));
        }
        break;
      }
    }
  }

  // Draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground(ctx);
  drawGrass(ctx);
  drawGround(ctx);

  fences.forEach(f => drawFence(ctx, f));

  if (state !== STATE.TITLE) {
    horse.draw(ctx);
    drawHUD(ctx);
  }

  if (state === STATE.TITLE) drawTitle(ctx);
  if (state === STATE.DEAD) { horse.draw(ctx); drawDead(ctx); }

  // Debug hitboxes (uncomment to enable)
  // if (state === STATE.PLAY) {
  //   const hb = horse.hitbox();
  //   ctx.strokeStyle = 'red'; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
  //   fences.forEach(f => { const fb = fenceHitbox(f); ctx.strokeStyle='blue'; ctx.strokeRect(fb.x,fb.y,fb.w,fb.h); });
  // }

  animFrame = requestAnimationFrame(gameLoop);
}

// Kick off
lastTime = performance.now();
animFrame = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
